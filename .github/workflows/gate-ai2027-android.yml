# Builds the GATE Solo Leveling AI 2027 app. Named uniquely so it never replaces an existing workflow in the repo.
# If this project lives in a sub-directory of the repo, set defaults.run.working-directory below.
name: GATE AI 2027 - Android debug build

on:
  push:
    paths:
      - 'GATE_Solo_Leveling_AI_2027/**'
      - '.github/workflows/gate-ai2027-android.yml'
  pull_request:
    paths:
      - 'GATE_Solo_Leveling_AI_2027/**'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GATE_Solo_Leveling_AI_2027   # change to "." if the project is at the repo root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: gate-ai2027-debug-apk
          path: GATE_Solo_Leveling_AI_2027/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gate-ai2027-reports
          path: GATE_Solo_Leveling_AI_2027/app/build/reports/**

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GATE_Solo_Leveling_AI_2027/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
